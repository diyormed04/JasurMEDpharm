::-webkit-scrollbar-track { background: #f1f1f1; }
::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 3px; }
.notification { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; color: white; font-weight: 500; z-index: 2000; animation: slideInRight 0.4s; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

function switchLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1))?.classList.add('active');
    document.getElementById('side' + lang.charAt(0).toUpperCase() + lang.slice(1))?.classList.add('active');
    updateTranslations();
    if (currentUser) renderPage();
}

function updateTranslations() {
    const t = translations[currentLang];
    document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
    });
}

function toggleDarkMode() {
    isDarkMode = !isDarkMode;
    document.documentElement.classList.toggle('dark', isDarkMode);
    saveData();
    renderPage();
}

function login() {
    const email = document.getElementById('emailInput').value.trim().toLowerCase();
    const password = document.getElementById('passwordInput').value;
    const cred = credentials.find(c => c.email.toLowerCase() === email && c.password === password);
    if (!cred) { showNotification(translations[currentLang].wrongPassword, 'danger'); return; }
    currentUser = { ...cred };
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = currentUser.role;
    document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);
    updateTranslations();
    renderSidebar();
    navigateTo('dashboard');
    showNotification(translations[currentLang].welcome + ', ' + currentUser.name + '!', 'success');
    requestNotificationPermission();
}

function logout() {
    currentUser = null; cart = [];
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
}

function renderSidebar() {
    const items = menuItems[currentUser.role] || [];
    const t = translations[currentLang];
    const html = items.map(item => `
        <button onclick="navigateTo('${item.id}')" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 text-gray-600 hover:text-primary ${currentPage === item.id ? 'active' : ''}">
            <i class="fas ${item.icon} w-5"></i>
            <span>${t[item.label]}</span>
            ${item.id === 'cart' && cart.length > 0 ? `<span class="ml-auto bg-primary text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">${cart.length}</span>` : ''}
        </button>
    `).join('');
    document.getElementById('sidebarNav').innerHTML = html;
    document.getElementById('mobileNav').innerHTML = html;
}

function navigateTo(page) {
    currentPage = page;
    renderSidebar();
    renderPage();
    if (window.innerWidth < 768) toggleMobileMenu();
}

function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('hidden');
}

function renderPage() {
    const container = document.getElementById('pageContent');
    container.innerHTML = '';
    switch(currentPage) {
        case 'dashboard': renderDashboard(container); break;
        case 'medicines': renderMedicines(container); break;
        case 'orders': renderOrders(container); break;
        case 'cart': renderCart(container); break;
        case 'users': renderUsers(container); break;
        case 'statistics': renderStatistics(container); break;
        case 'deliveries': renderDeliveries(container); break;
        case 'prescriptions': renderPrescriptions(container); break;
        case 'inventory': renderInventory(container); break;
        case 'pharmacyInfo': renderPharmacyInfo(container); break;
        case 'faq': renderFAQ(container); break;
        case 'settings': renderSettings(container); break;
        default: renderDashboard(container);
    }
}

                                    <button onclick="openMedicineModal(${med.id})" class="flex-1 bg-gray-100 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-200"><i class="fas fa-edit mr-1"></i>${t.edit}</button>
                                    <button onclick="deleteMedicine(${med.id})" class="px-3 bg-red-50 text-red-500 py-2 rounded-lg text-sm hover:bg-red-100"><i class="fas fa-trash"></i></button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function addToCart(medId) {
    const med = medicines.find(m => m.id === medId);
    if (!med || med.stock === 0) return;
    const existing = cart.find(item => item.id === medId);
    if (existing) {
        if (existing.quantity < med.stock) existing.quantity++;
        else { showNotification('Omborda yetarli emas!', 'warning'); return; }
    } else {
        cart.push({ ...med, quantity: 1 });
    }
    renderSidebar();
    showNotification(translations[currentLang].addToCart + ' ✓', 'success');
}

function previewPrescription(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        prescriptionImageBase64 = e.target.result;
        document.getElementById('prescriptionPreview').classList.remove('hidden');
        document.getElementById('previewImg').src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function updateCartQty(idx, delta) {
    const item = cart[idx];
    const med = medicines.find(m => m.id === item.id);
    const newQty = item.quantity + delta;
    if (newQty < 1) removeFromCart(idx);
    else if (newQty > med.stock) showNotification('Omborda yetarli emas!', 'warning');
    else { item.quantity = newQty; renderPage(); }
}

function removeFromCart(idx) {
    cart.splice(idx, 1);
    renderSidebar();
    renderPage();
}

function clearCart() {
    cart = [];
    prescriptionImageBase64 = null;
    renderSidebar();
    renderPage();
}

function checkout() {
    const t = translations[currentLang];
    if (cart.length === 0) return;
    const hasPrescription = cart.some(item => item.prescription);
    if (hasPrescription && !prescriptionImageBase64) {
        showNotification('Retsept rasmini yuklang!', 'warning');
        return;
    }
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    const orderId = Date.now();
    const newOrder = {
        id: orderId,
        customerId: currentUser.email,
        customerName: currentUser.name,
        items: JSON.parse(JSON.stringify(cart)),
        total,
        status: 'pending',
        prescriptionStatus: hasPrescription ? 'pending' : 'approved',
        prescriptionImage: prescriptionImageBase64,
        date: new Date().toISOString(),
        address: pharmacyInfo.address[currentLang],
        availableItems: null
    };
    orders.unshift(newOrder);
    cart.forEach(item => {
        const med = medicines.find(m => m.id === item.id);
        if (med) med.stock -= item.quantity;
    });
    chatData[orderId] = [];
    saveData();
    cart = [];
    prescriptionImageBase64 = null;
    renderSidebar();
    document.getElementById('pageContent').innerHTML = `
        <div class="fade-in text-center py-20">
            <div class="w-20 h-20 bg-success/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-success text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-secondary mb-2">${t.orderSuccess}</h2>
            <p class="text-gray-500 mb-2">${t.orderNumber}: <span class="font-bold text-primary">#${orderId}</span></p>
            ${hasPrescription ? `<p class="text-sm text-warning mb-4"><i class="fas fa-clock mr-1"></i>Retseptingiz farmatsevt tasdig'ini kutyapti</p>` : ''}
            <div class="flex justify-center gap-4 mt-8">
                <button onclick="navigateTo('orders')" class="bg-primary text-white px-6 py-3 rounded-xl font-medium hover:bg-primary/90">${t.trackOrder}</button>
                <button onclick="navigateTo('medicines')" class="border border-gray-200 text-gray-600 px-6 py-3 rounded-xl font-medium hover:bg-gray-50">${t.continueShopping}</button>
            </div>
        </div>
    `;
    showNotification(t.orderSuccess, 'success');
    if (hasPrescription) sendBrowserNotification('Yangi retseptli buyurtma', `Buyurtma #${orderId} retsept tekshiruvini kutmoqda`);
}

function sendChatMessage(orderId) {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    if (!chatData[orderId]) chatData[orderId] = [];
    chatData[orderId].push({ from: currentUser.email, text, time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) });
    saveData();
    input.value = '';
    openOrderChat(orderId);
}

function approvePrescription(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.prescriptionStatus = 'approved';
        if (!chatData[orderId]) chatData[orderId] = [];
        chatData[orderId].push({ from: 'system', text: 'Retsept tasdiqlandi. Dorilar tayyorlanmoqda.', time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) });
        saveData();
        closeModal();
        renderPage();
        showNotification(translations[currentLang].prescriptionApproved, 'success');
        sendBrowserNotification('Retsept tasdiqlandi', `Buyurtma #${orderId} retsepti tasdiqlandi`);
    }
}

function rejectPrescription(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.prescriptionStatus = 'rejected';
        if (!chatData[orderId]) chatData[orderId] = [];
        chatData[orderId].push({ from: 'system', text: 'Retsept rad etildi. Iltimos, aniqroq rasm yuklang.', time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) });
        saveData();
        closeModal();
        renderPage();
        showNotification(translations[currentLang].prescriptionRejected, 'danger');
    }
}

function requestReupload(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.prescriptionStatus = 'rejected';
        if (!chatData[orderId]) chatData[orderId] = [];
        chatData[orderId].push({ from: currentUser.email, text: 'Retsept rasmi xira. Iltimos, qayta yuklang.', time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) });
        saveData();
        closeModal();
        renderPage();
        showNotification('Qayta yuklash so'raldi', 'warning');
    }
}

function reuploadPrescription(orderId, input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const order = orders.find(o => o.id === orderId);
        if (order) {
            order.prescriptionImage = e.target.result;
            order.prescriptionStatus = 'pending';
            if (!chatData[orderId]) chatData[orderId] = [];
            chatData[orderId].push({ from: currentUser.email, text: 'Yangi retsept rasmi yuklandi.', time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) });
            saveData();
            closeModal();
            renderPage();
            showNotification('Retsept qayta yuklandi', 'success');
        }
    };
    reader.readAsDataURL(file);
}

function setItemAvailable(orderId, itemId, value) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        if (!order.availableItems) order.availableItems = {};
        order.availableItems[itemId] = value;
        saveData();
    }
}

function updateOrderStatus(orderId, status) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = status;
        saveData();
        renderPage();
        showNotification(translations[currentLang].orderUpdated + ' ✓', 'success');
        if (status === 'completed') sendBrowserNotification('Buyurtma tugatildi', `Buyurtma #${orderId} yetkazib berildi`);
    }
}

    closeModal();
    renderPage();
    showNotification(translations[currentLang].save + ' ✓', 'success');
}

function changePassword() {
    const t = translations[currentLang];
    const current = document.getElementById('currentPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirm = document.getElementById('confirmPass').value;
    const cred = credentials.find(c => c.email === currentUser.email);
    if (!cred || cred.password !== current) { showNotification(t.wrongPassword, 'danger'); return; }
    if (newPass !== confirm) { showNotification(t.passwordMismatch, 'warning'); return; }
    if (newPass.length < 4) { showNotification('Parol kamida 4 ta belgi', 'warning'); return; }
    cred.password = newPass;
    currentUser.password = newPass;
    saveData();
    document.getElementById('currentPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
    showNotification(t.passwordChanged, 'success');
}

                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">${t.name}</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">${t.role}</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">${t.actions}</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        ${credentials.map((cred, idx) => `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 font-medium">${cred.name}</td>
                                <td class="px-6 py-4 text-sm text-gray-500">${cred.email}</td>
                                <td class="px-6 py-4"><span class="px-2 py-1 bg-primary/10 text-primary rounded-full text-xs font-medium capitalize">${t['role' + cred.role.charAt(0).toUpperCase() + cred.role.slice(1)] || cred.role}</span></td>
                                <td class="px-6 py-4"><button onclick="editCredential(${idx})" class="text-primary text-sm hover:underline mr-3">${t.edit}</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function renderStatistics(container) {
    const t = translations[currentLang];
    const catStats = {};
    medicines.forEach(m => { catStats[m.category] = (catStats[m.category] || 0) + 1; });
    const monthlyRevenue = {};
    orders.filter(o => o.status === 'completed').forEach(o => {
        const month = o.date.slice(0, 7);
        monthlyRevenue[month] = (monthlyRevenue[month] || 0) + o.total;
    });
    container.innerHTML = `
        <div class="fade-in">
            <h1 class="text-2xl font-bold text-secondary mb-6">${t.statistics}</h1>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="font-bold text-secondary mb-4">${t.medicines} - ${t.category}</h3>
                    <div class="space-y-3">
                        ${Object.entries(catStats).map(([cat, count]) => `
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">${t[cat] || cat}</span>
                                <div class="flex items-center gap-3 flex-1 mx-4">
                                    <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width: ${(count / medicines.length * 100)}%"></div></div>
                                    <span class="text-sm font-medium w-8 text-right">${count}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="font-bold text-secondary mb-4">${t.revenue} - ${t.month}</h3>
                    <div class="space-y-3">
                        ${Object.entries(monthlyRevenue).sort().slice(-6).map(([month, rev]) => `
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">${month}</span>
                                <div class="flex items-center gap-3 flex-1 mx-4">
                                    <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-success rounded-full" style="width: 100%"></div></div>
                                    <span class="text-sm font-medium w-20 text-right">${rev.toLocaleString()}</span>
                                </div>
                            </div>
                        `).join('') || `<p class="text-gray-400 text-center py-4">${t.noNotifications}</p>`}
                    </div>
                </div>
            </div>
        </div>
    `;
}


function openMedicineModal(medId) {
    const t = translations[currentLang];
    const med = medId ? medicines.find(m => m.id === medId) : null;
    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML = `
        <h2 class="text-xl font-bold text-secondary mb-4">${med ? t.edit : t.addMedicine}</h2>
        <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">${t.name} (Lotin)</label><input type="text" id="medNameLotin" value="${med ? med.name.lotin : ''}" class="w-full px-4 py-2 rounded-lg border border-gray-200 search-input"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">${t.name} (Kril)</label><input type="text" id="medNameKril" value="${med ? med.name.kril : ''}" class="w-full px-4 py-2 rounded-lg border border-gray-200 search-input"></div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">${t.price}</label><input type="number" id="medPrice" value="${med ? med.price : ''}" class="w-full px-4 py-2 rounded-lg border border-gray-200 search-input"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">${t.stock}</label><input type="number" id="medStock" value="${med ? med.stock : ''}" class="w-full px-4 py-2 rounded-lg border border-gray-200 search-input"></div>
            </div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">${t.category}</label>
                <select id="medCat" class="w-full px-4 py-2 rounded-lg border border-gray-200 search-input bg-white">
                    <option value="painkillers">${t.painkillers}</option>
                    <option value="antibiotics">${t.antibiotics}</option>
                    <option value="vitamins">${t.vitamins}</option>
                    <option value="cold">${t.cold}</option>
                    <option value="heart">${t.heart}</option>
                    <option value="diabetes">${t.diabetes}</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" id="medPrescription" ${med && med.prescription ? 'checked' : ''} class="w-4 h-4 text-primary rounded">
                <label for="medPrescription" class="text-sm text-gray-700">${t.prescriptionRequired}</label>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="saveMedicine(${medId || 0})" class="flex-1 bg-primary text-white py-2 rounded-lg font-medium">${t.save}</button>
                <button onclick="closeModal()" class="flex-1 border border-gray-200 text-gray-600 py-2 rounded-lg font-medium">${t.cancel}</button>
            </div>
        </div>
    `;
    if (med) document.getElementById('medCat').value = med.category;
    document.getElementById('modal').classList.add('show');
}

function saveMedicine(medId) {
    const nameLotin = document.getElementById('medNameLotin').value;
    const nameKril = document.getElementById('medNameKril').value;
    const price = parseInt(document.getElementById('medPrice').value) || 0;
    const stock = parseInt(document.getElementById('medStock').value) || 0;
    const category = document.getElementById('medCat').value;
    const prescription = document.getElementById('medPrescription').checked;
    if (!nameLotin || !nameKril) { showNotification('Barcha maydonlarni to'ldiring!', 'warning'); return; }
    if (medId) {
        const med = medicines.find(m => m.id === medId);
        med.name = { lotin: nameLotin, kril: nameKril };
        med.price = price; med.stock = stock; med.category = category; med.prescription = prescription;
    } else {
        medicines.push({
            id: Date.now(), name: { lotin: nameLotin, kril: nameKril }, category, price, stock, prescription,
            image: "💊", manufacturer: "Jasur Med", expiry: "2027-12",
            description: { lotin: "Yangi dori", kril: "Янги дори" }
        });
    }
    saveData(); closeModal(); renderPage();
    showNotification(translations[currentLang].save + ' ✓', 'success');
}

function deleteMedicine(medId) {
    if (confirm('O'chirishni tasdiqlaysizmi?')) {
        medicines = medicines.filter(m => m.id !== medId);
        saveData(); renderPage();
        showNotification(translations[currentLang].delete + ' ✓', 'success');
    }
}

function closeModal(e) {
    if (!e || e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('show');
        document.getElementById('modalBody').parentElement.classList.remove('modal-lg');
    }
}

function showNotification(message, type) {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.style.background = type === 'success' ? '#10b981' : type === 'danger' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#0d9488';
    notif.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'danger' ? 'fa-times-circle' : 'fa-info-circle'} mr-2"></i>${message}`;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
}

// Browser Notifications
function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
}

function sendBrowserNotification(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/4320/4320337.png' });
    }
}

// PWA Install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

function installPWA() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                showNotification('Ilova o'rnatildi!', 'success');
            }
            deferredPrompt = null;
        });
    } else {
        showNotification('Brauzeringiz PWA ni qo'llab-quvvatlamaydi yoki allaqachon o'rnatilgan', 'warning');
    }
}

// Service Worker Registration
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
    `)).catch(() => {});
}

updateTranslations();
</script>
</body>
</html>
